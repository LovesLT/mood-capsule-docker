version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: moodcapsule-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: moodcapsuledb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mood-network

  backend:
    build:
      context: ./MoodCapsuleBackend
      dockerfile: Dockerfile
    container_name: moodcapsule-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mood-network

  frontend:
    build:
      context: ./moodcapsule-frontend
      dockerfile: Dockerfile
    container_name: moodcapsule-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - mood-network

volumes:
  db_data:

networks:
  mood-network:
    driver: bridge